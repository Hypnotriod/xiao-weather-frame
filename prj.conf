CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_SPI=y

CONFIG_SENSOR=y
CONFIG_SENSOR_ASYNC_API=y
CONFIG_BME280_MODE_FORCED=y

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="XIAO-Weather-Frame"
CONFIG_CDC_ACM_SERIAL_PID=0x0006
CONFIG_CDC_ACM_SERIAL_VID=0x2FE3
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
# Fix: <err> udc: Failed to allocate net_buf 4095, ep 0x80
CONFIG_UDC_BUF_POOL_SIZE=8192

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_LOG=y

CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_SMP=y
CONFIG_BT_GATT_CLIENT=y
# Increase transmitter power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
